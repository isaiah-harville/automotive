name: Devcontainer

on:
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # devcontainers/ci exports OCI images, which the default "docker"
      # buildx driver can't produce - it needs the docker-container driver.
      - uses: docker/setup-buildx-action@v3

      # Only main has permission to publish; PRs just build to confirm the
      # Dockerfile + features still work.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) the devcontainer image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/isaiah-harville/automotive/devcontainer
          imageTag: latest,${{ github.sha }}
          cacheFrom: ghcr.io/isaiah-harville/automotive/devcontainer
          push: ${{ github.event_name == 'push' && 'always' || 'never' }}
          platform: linux/amd64
