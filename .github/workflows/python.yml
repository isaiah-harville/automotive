name: Python

on:
  pull_request:
    paths:
      - "components/python/**"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "components/python/**"
      - ".github/workflows/python.yml"

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/python/report-formatter
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ty check
        run: uv run ty check .
